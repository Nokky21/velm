[package]
name = "term-sql"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
term-config = { path = "../term-config" }
ratatui = "0.30"
crossterm = "0.29"
postgres = "0.19"
sqlparser = { version = "0.64", default-features = false, features = ["std"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
