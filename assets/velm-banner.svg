<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="velm — Multiplexor de terminal en Rust con privacidad verificable y herramientas locales term-*">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="958" height="268" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base card -->
    <rect x="0" y="0" width="960" height="270" rx="14" fill="url(#bg)"/>
    <!-- Subtle radial-like ambient accent -->
    <ellipse cx="180" cy="135" rx="260" ry="150" fill="url(#glow)"/>

    <!-- Window title bar -->
    <rect x="0" y="0" width="960" height="36" fill="#11111b"/>
    <line x1="0" y1="36" x2="960" y2="36" stroke="#313244" stroke-width="1"/>
    <circle cx="22" cy="18" r="5.5" fill="#f38ba8"/>
    <circle cx="40" cy="18" r="5.5" fill="#f9e2af"/>
    <circle cx="58" cy="18" r="5.5" fill="#a6e3a1"/>
    <text x="480" y="22" text-anchor="middle" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">alacritty — velm · macOS Apple Silicon</text>

    <!-- Left column: identity -->
    <g transform="translate(48, 72)">
      <!-- Prompt + Brand -->
      <text x="0" y="42" fill="#94e2d5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700">›</text>
      <text x="32" y="42" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="46" font-weight="800" letter-spacing="-1">velm</text>
      <rect x="166" y="16" width="84" height="22" rx="11" fill="#313244"/>
      <text x="208" y="31" text-anchor="middle" fill="#cdd6f4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">local-first</text>

      <!-- Tagline -->
      <text x="0" y="76" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500">Multiplexor de terminal en Rust para el día a día en macOS</text>
      <text x="0" y="100" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Cero telemetría · Marcas OSC 133 · Suite modular term-* apagada por defecto</text>

      <!-- Feature pills -->
      <g transform="translate(0, 126)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">
        <rect x="0" y="0" width="76" height="26" rx="6" fill="#181825" stroke="#89b4fa" stroke-opacity="0.5"/>
        <text x="38" y="17" text-anchor="middle" fill="#89b4fa">OSC 133</text>

        <rect x="86" y="0" width="76" height="26" rx="6" fill="#181825" stroke="#cba6f7" stroke-opacity="0.5"/>
        <text x="124" y="17" text-anchor="middle" fill="#cba6f7">term-ai</text>

        <rect x="172" y="0" width="96" height="26" rx="6" fill="#181825" stroke="#a6e3a1" stroke-opacity="0.5"/>
        <text x="220" y="17" text-anchor="middle" fill="#a6e3a1">term-repos</text>

        <rect x="278" y="0" width="84" height="26" rx="6" fill="#181825" stroke="#f9e2af" stroke-opacity="0.5"/>
        <text x="320" y="17" text-anchor="middle" fill="#f9e2af">term-sql</text>

        <rect x="372" y="0" width="104" height="26" rx="6" fill="#181825" stroke="#f5c2e7" stroke-opacity="0.5"/>
        <text x="424" y="17" text-anchor="middle" fill="#f5c2e7">term-claude</text>
      </g>
    </g>

    <!-- Right column: minimalist TUI pane illustration -->
    <g transform="translate(578, 56)">
      <rect x="0" y="0" width="340" height="188" rx="10" fill="#11111b" stroke="#313244" stroke-width="1.2"/>

      <!-- Sidebar column inside mini TUI -->
      <rect x="0" y="0" width="92" height="164" rx="10" fill="#181825"/>
      <rect x="82" y="0" width="10" height="164" fill="#181825"/>
      <line x1="92" y1="0" x2="92" y2="164" stroke="#313244" stroke-width="1"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">
        <text x="12" y="20" fill="#6c7086" font-weight="700">WORKSPACES</text>
        <rect x="8" y="28" width="76" height="20" rx="4" fill="#313244"/>
        <circle cx="18" cy="38" r="3" fill="#a6e3a1"/>
        <text x="27" y="41" fill="#cdd6f4">velm</text>

        <circle cx="18" cy="60" r="3" fill="#89b4fa"/>
        <text x="27" y="63" fill="#a6adc8">repos</text>

        <circle cx="18" cy="80" r="3" fill="#f9e2af"/>
        <text x="27" y="83" fill="#a6adc8">sql-dev</text>

        <circle cx="18" cy="100" r="3" fill="#f5c2e7"/>
        <text x="27" y="103" fill="#a6adc8">claude</text>

        <!-- Main pane top half -->
        <text x="106" y="22" fill="#94e2d5">$</text>
        <text x="118" y="22" fill="#cdd6f4">cargo deny check</text>
        <text x="106" y="38" fill="#a6e3a1">advisories ok, bans ok</text>
        <text x="106" y="53" fill="#a6e3a1">licenses ok, sources ok</text>

        <!-- Split divider -->
        <line x1="92" y1="74" x2="340" y2="74" stroke="#313244" stroke-width="1"/>

        <!-- Bottom pane: term-ai / privacy -->
        <text x="106" y="94" fill="#cba6f7">⌘E</text>
        <text x="126" y="94" fill="#bac2de">term.explain_last</text>
        <text x="106" y="112" fill="#6c7086">├─</text>
        <text x="124" y="112" fill="#a6adc8">http://127.0.0.1:1234/v1</text>
        <text x="106" y="128" fill="#6c7086">├─</text>
        <text x="124" y="128" fill="#a6adc8">loopback · sin TLS</text>
        <text x="106" y="144" fill="#6c7086">└─</text>
        <text x="124" y="144" fill="#a6e3a1">0 conexiones externas</text>
      </g>

      <!-- Mini status bar -->
      <line x1="0" y1="164" x2="340" y2="164" stroke="#313244" stroke-width="1"/>
      <text x="12" y="179" fill="#94e2d5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600">● PRIVACY LOCK</text>
      <text x="328" y="179" text-anchor="end" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5">OSC 133 · Apache-2.0</text>
    </g>
  </g>

  <!-- Outer border -->
  <rect x="0.75" y="0.75" width="958.5" height="268.5" rx="14" fill="none" stroke="#313244" stroke-width="1.5"/>
</svg>
