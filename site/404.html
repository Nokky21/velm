<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — velm</title>
  <meta name="theme-color" content="#0a0b0d" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    :root {
      --bg: #0a0b0d;
      --surface: #111317;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #2dd4bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(45, 212, 191, 0.09), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      text-align: left;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    a {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .primary {
      background: var(--accent);
      color: #042f2e;
    }
    .secondary {
      border: 1px solid var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">$ velm open &lt;ruta&gt; → exit 404</div>
    <h1>Página no encontrada</h1>
    <p>La ruta solicitada no existe en el sitio de <strong>velm</strong>. Vuelve a la página principal para consultar la documentación, instalación en macOS/Linux/Windows o el repositorio en GitHub.</p>
    <div class="actions">
      <a class="primary" href="./">Volver a velm</a>
      <a class="secondary" href="https://github.com/Nokky21/velm" target="_blank" rel="noopener">GitHub</a>
    </div>
  </main>
</body>
</html>
