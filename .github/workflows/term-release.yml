name: term-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: "true"
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

concurrency:
  group: term-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build velm (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
          - label: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: tar.gz
          - label: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig 0.16.0
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Set Linux arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          key: term-release-${{ matrix.target }}

      - name: Clean Zig build caches before release build
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build release binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p velm -p term-ai -p term-repos -p term-sql -p term-claude

      - name: Package Unix tarball and SHA-256 checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          LABEL="${{ matrix.label }}"
          ARCHIVE="velm-${TAG}-${LABEL}.tar.gz"
          STAGE="dist/velm-${TAG}-${LABEL}"
          rm -rf dist out
          mkdir -p "$STAGE/shell" "$STAGE/extras" out

          for bin in velm term-ai term-repos term-sql term-claude; do
            cp "target/${{ matrix.target }}/release/${bin}" "$STAGE/${bin}"
            chmod +x "$STAGE/${bin}"
          done

          cp LICENSE NOTICE README.md "$STAGE/"
          cp shell/term.zsh "$STAGE/shell/term.zsh"
          cp extras/alacritty.toml "$STAGE/extras/alacritty.toml"

          tar -C dist -czf "out/${ARCHIVE}" "velm-${TAG}-${LABEL}"
          (
            cd out
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            fi
          )

      - name: Package Windows zip and SHA-256 checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = $env:GITHUB_REF_NAME
          $Label = "${{ matrix.label }}"
          $Archive = "velm-$Tag-$Label.zip"
          $Stage = "dist/velm-$Tag-$Label"
          Remove-Item -Recurse -Force dist, out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$Stage/shell", "$Stage/extras", "out" | Out-Null

          foreach ($bin in @("velm.exe", "term-ai.exe", "term-repos.exe", "term-sql.exe", "term-claude.exe")) {
            Copy-Item "target/${{ matrix.target }}/release/$bin" "$Stage/$bin"
          }

          Copy-Item LICENSE, NOTICE, README.md "$Stage/"
          Copy-Item shell/term.zsh "$Stage/shell/term.zsh"
          Copy-Item extras/alacritty.toml "$Stage/extras/alacritty.toml"

          Compress-Archive -Path "$Stage" -DestinationPath "out/$Archive"
          $Hash = (Get-FileHash -Path "out/$Archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Archive" | Set-Content -NoNewline -Encoding ascii "out/$Archive.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velm-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          cat *.sha256 | sort > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: release-assets/*
