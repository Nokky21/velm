name: term-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: "true"
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

concurrency:
  group: term-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    name: Build and publish velm release (macOS arm64)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-apple-darwin

      - name: Install Zig 0.16.0
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install macOS build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          key: term-release-aarch64-apple-darwin

      - name: Clean Zig build caches before release build
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build macOS arm64 release binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin \
            -p velm \
            -p term-ai \
            -p term-repos \
            -p term-sql \
            -p term-claude

      - name: Package tarball and SHA-256 checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="velm-${TAG}-macos-arm64.tar.gz"
          STAGE="dist/velm-${TAG}-macos-arm64"
          rm -rf dist
          mkdir -p "$STAGE"

          for bin in velm term-ai term-repos term-sql term-claude; do
            cp "target/aarch64-apple-darwin/release/${bin}" "$STAGE/${bin}"
            chmod +x "$STAGE/${bin}"
          done

          cp LICENSE NOTICE README.md "$STAGE/"
          mkdir -p "$STAGE/shell" "$STAGE/extras"
          cp shell/term.zsh "$STAGE/shell/term.zsh"
          cp extras/alacritty.toml "$STAGE/extras/alacritty.toml"

          tar -C dist -czf "$ARCHIVE" "velm-${TAG}-macos-arm64"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
